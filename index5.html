<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Purple Anime World 💜</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        color: #674783;
        overflow: hidden;
      }

      .page {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 25px;
        overflow: hidden;
        background: linear-gradient(135deg, #fff4fc, #eadbff, #f8eaff);
      }

      .page.active {
        display: flex;
        animation: appear 0.7s ease;
      }

      h1 {
        font-size: clamp(27px, 6vw, 43px);
        margin-bottom: 12px;
        color: #8056aa;
      }

      p {
        font-size: 14px;
        line-height: 1.8;
      }

      .picture {
        width: min(290px, 72vw);
        height: min(290px, 72vw);
        object-fit: cover;
        border-radius: 30px;
        border: 5px solid white;
        box-shadow: 0 10px 35px #b99bd477;
        margin: 25px 0 15px;
        animation: float 3s ease-in-out infinite;
      }

      button {
        border: none;
        background: linear-gradient(135deg, #c39be9, #9469c4);
        color: white;
        padding: 13px 25px;
        border-radius: 30px;
        font-weight: bold;
        margin: 8px;
        cursor: pointer;
        box-shadow: 0 5px 15px #a37cc455;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-3px) scale(1.04);
      }

      .stars,
      .sparkles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .star,
      .sparkle {
        position: absolute;
        color: white;
        text-shadow:
          0 0 8px #a46bdc,
          0 0 15px #d9aaff;
        animation: twinkle var(--duration) ease-in-out infinite;
        animation-delay: var(--delay);
      }

      .star {
        animation-name: floatStar;
      }

      .second .picture {
        opacity: 0;
        transform: scale(0.8);
        animation: none;
      }

      .second.active .picture {
        animation:
          photoShow 1s ease forwards,
          float 3s 1s ease-in-out infinite;
      }

      .caption {
        color: #9875b2;
        margin-bottom: 18px;
      }

      .number {
        position: absolute;
        bottom: 18px;
        font-size: 11px;
        letter-spacing: 3px;
        color: #a58ab9;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes float {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -9px;
        }
      }

      @keyframes floatStar {
        0% {
          transform: translateY(30px) rotate(0);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) rotate(180deg);
          opacity: 0;
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.5) rotate(0);
        }
        50% {
          opacity: 1;
          transform: scale(1.3) rotate(45deg);
        }
      }

      @keyframes photoShow {
        0% {
          opacity: 0;
          transform: scale(0.8);
          filter: brightness(1.8);
        }
        60% {
          opacity: 1;
          transform: scale(1.04);
          filter: brightness(1.3);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: brightness(1);
        }
      }

      @media (max-height: 680px) {
        .picture {
          width: min(220px, 38vh);
          height: min(220px, 38vh);
          margin: 12px 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- HALAMAN 1 -->
    <section class="page active" id="page1">
      <div class="stars" id="stars"></div>

      <p>✧ WELCOME TO MY WORLD ✧</p>
      <h1>Hello, Beautiful Soul! 💜</h1>
      <p>A little world full of stars, dreams, and magic.</p>

      <img
        class="picture"
        src="pictures/animeungu.gif"
        alt="Anime ungu bergerak"
      />

      <p class="caption">You are my little universe ♡</p>
      <button onclick="showPage(2)">Next Page ♡ →</button>

      <div class="number">01 / 02</div>
    </section>

    <!-- HALAMAN 2 -->
    <section class="page second" id="page2">
      <div class="sparkles" id="sparkles"></div>

      <p>✧ A LITTLE PIECE OF MAGIC ✧</p>
      <h1>Stay Magical! 🌷</h1>
      <p>Every little sparkle makes this world beautiful.</p>

      <img
        class="picture"
        id="animePhoto"
        src="pictures/animeungu.png"
        alt="Foto anime ungu"
      />

      <p class="caption">Soft heart, dreamy soul 💜</p>

      <div>
        <button onclick="showPage(1)">← Previous</button>
        <button onclick="shineAgain()">Shine Again ✨</button>
      </div>

      <div class="number">02 / 02</div>
    </section>

    <script>
      function makeEffects(containerId, count, character, className) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        for (let i = 0; i < count; i++) {
          const item = document.createElement("span");
          item.className = className;
          item.textContent = character;
          item.style.left = Math.random() * 100 + "%";
          item.style.top = Math.random() * 100 + "%";
          item.style.fontSize = 8 + Math.random() * 13 + "px";
          item.style.setProperty("--duration", 1.5 + Math.random() * 5 + "s");
          item.style.setProperty("--delay", -Math.random() * 5 + "s");
          container.appendChild(item);
        }
      }

      function showPage(number) {
        document.querySelectorAll(".page").forEach((page) => {
          page.classList.remove("active");
        });

        document.getElementById("page" + number).classList.add("active");

        if (number === 2) {
          shineAgain();
        }
      }

      function shineAgain() {
        const photo = document.getElementById("animePhoto");
        photo.style.animation = "none";
        void photo.offsetWidth;
        photo.style.animation =
          "photoShow 1s ease forwards, float 3s 1s ease-in-out infinite";

        makeEffects("sparkles", 40, "✦", "sparkle");
      }

      makeEffects("stars", 35, "✦", "star");
      makeEffects("sparkles", 40, "✧", "sparkle");
    </script>
  </body>
</html>
